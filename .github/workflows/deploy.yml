name: Deploy

# Cada push a main actualiza https://lux.eternum.lat sin downtime, igual que el
# preview de dev: deploy/lux-prod.sh (versionado en este repo) clona main en el slot idle,
# buildea, corre migraciones, levanta la API de ese slot, espera /ready y recien
# ahi mueve el symlink y el upstream. Si la verificacion publica falla vuelve
# solo al slot anterior. El slot viejo sigue corriendo: rollback = switch.
#
# Produccion corre contra la API real y Postgres. Nunca contra MSW: este
# workflow falla si el bundle publicado trae los mocks.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lux
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      SITE: https://lux.eternum.lat
    steps:
      # El deploy vive en el repo (deploy/lux-prod.sh): lo que se mergea es lo
      # que corre. Lo unico que queda fuera son los .env de /home/hermes/deploy/env.
      - uses: actions/checkout@v4

      - name: Estado antes del deploy
        run: ./deploy/lux-prod.sh --status || true

      - name: Deploy blue/green
        run: ./deploy/lux-prod.sh

      - name: Verificar publicacion
        env:
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          corto="${SHA:0:7}"

          # Lo que sirve produccion tiene que ser el commit de ESTE push.
          publicado=""
          for attempt in 1 2 3 4 5 6; do
            publicado=$(curl -4 -s -m 30 "$SITE/BUILD_INFO" | awk '{print $1}')
            [ "$publicado" = "$corto" ] && break
            echo "intento $attempt: BUILD_INFO responde '${publicado:-nada}', esperado $corto"
            sleep 10
          done
          if [ "$publicado" != "$corto" ]; then
            echo "::error::$SITE no sirve el commit $corto."
            exit 1
          fi

          # API viva de punta a punta (nginx -> API -> Postgres con migraciones).
          # Se mira el cuerpo y no solo el 200: el fallback del SPA responde
          # index.html con 200 en cualquier ruta que nginx no proxee.
          ready=$(curl -s -m 30 "$SITE/ready")
          if ! printf '%s' "$ready" | grep -q '"ok":true'; then
            echo "::error::$SITE/ready no responde la API (${ready:0:80}): la API o la base no estan listas."
            exit 1
          fi
          gql=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST -H 'content-type: application/json' \
            -d '{"query":"{ __typename }"}' "$SITE/graphql")
          if [ "$gql" != "200" ]; then
            echo "::error::POST $SITE/graphql responde $gql."
            exit 1
          fi

          # Bundle completo y sin mocks.
          curl -fsS -m 35 -o index.html "$SITE/"
          asset=$(grep -o '/assets/index-[^"]*\.js' index.html | head -1)
          if [ -z "$asset" ] || ! curl -fsS -m 35 -o bundle.js "$SITE$asset"; then
            echo "::error::El bundle principal no se puede descargar desde produccion."
            exit 1
          fi
          if grep -q "root2026" bundle.js; then
            echo "::error::El bundle salio con los mocks de MSW (credenciales de prueba incluidas)."
            exit 1
          fi
          worker=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$SITE/mockServiceWorker.js")
          if [ "$worker" = "200" ] && ! grep -qi '<!doctype html' <(curl -s -m 30 "$SITE/mockServiceWorker.js"); then
            echo "::error::Produccion publica /mockServiceWorker.js."
            exit 1
          fi
          echo "produccion: commit $corto, API lista, sin mocks"

      - name: Limpiar
        if: always()
        run: rm -f index.html bundle.js
